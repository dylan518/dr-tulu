tool_parser: "minimax_xml"

# Search agent (MiniMax) config
search_agent_base_url: ${oc.env:MINIMAX_BASE_URL,"http://127.0.0.1:30003/v1"}
search_agent_model_name: ${oc.env:MINIMAX_MODEL_NAME,"minimax-m2.1"}
search_agent_api_key: ${oc.env:MINIMAX_API_KEY,""}
search_agent_max_tokens: 32000
search_agent_temperature: 0.7
search_agent_max_tool_calls: 10

# Browse/reader agent (optional)
use_browse_agent: false

# Search tool configuration
number_documents_to_search: 10
search_timeout: 60

# Browse tool configuration
browse_tool_name: "jina"
browse_timeout: 60
browse_max_pages_to_fetch: 10
browse_context_char_length: 6000

# Prompt must match the tool call format (MiniMax XML)
prompt_version: "minimax_xml"


