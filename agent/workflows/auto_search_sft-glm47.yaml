tool_parser: "v20250824"

# IMPORTANT: use Serper for search by default (does NOT require Semantic Scholar).
# If you do not have a Semantic Scholar key, do NOT set search_tool_name to "s2"/"s2-only".
search_tool_name: ${oc.env:GLM47_SEARCH_TOOL,"serper"}

# Search agent (GLM-4.7 via OpenAI-compatible API, e.g. vLLM/SGLang)
# - Set GLM47_BASE_URL to your server, e.g. http://localhost:30001/v1
# - Set GLM47_MODEL_NAME to whatever your server exposes. If you serve with vLLM and
#   pass the HF repo ID as the model path, the served model name usually matches it.
# - Set GLM47_API_KEY if your server requires it (otherwise it can be any string)
search_agent_base_url: ${oc.env:GLM47_BASE_URL,"http://127.0.0.1:30002/v1"}
search_agent_model_name: ${oc.env:GLM47_MODEL_NAME,"zai-org/GLM-4.7-FP8"}
search_agent_api_key: ${oc.env:GLM47_API_KEY,"dummy-key"}
# NOTE: this repo's generation loop treats max_tokens as a TOTAL token budget (prompt+completion),
# so it must be large enough to fit the system prompt + question.
# Keep it <= vLLM's --max-model-len (we use 4096 in the GLM launch command).
search_agent_max_tokens: ${oc.env:GLM47_MAX_TOKENS,4096}
search_agent_temperature: 1.0
search_agent_max_tool_calls: ${oc.env:GLM47_MAX_TOOL_CALLS,6}
search_agent_tool_calling_mode: ${oc.env:GLM47_TOOL_CALLING_MODE,"native"}
search_agent_force_first_tool: ${oc.env:GLM47_FORCE_FIRST_TOOL,"snippet_search"}

# Browse/reader agent (optional)
use_browse_agent: false
browse_agent_base_url: ${oc.env:GLM47_BROWSE_BASE_URL,"http://127.0.0.1:30002/v1"}
browse_agent_model_name: ${oc.env:GLM47_BROWSE_MODEL_NAME,"glm-4.7"}
browse_agent_api_key: ${oc.env:GLM47_BROWSE_API_KEY,"dummy-key"}
browse_agent_max_tokens: ${oc.env:GLM47_BROWSE_MAX_TOKENS,512}
browse_agent_temperature: 0.3

# Search tool configuration
number_documents_to_search: ${oc.env:GLM47_NUM_DOCS,5}
search_timeout: ${oc.env:GLM47_SEARCH_TIMEOUT,30}

# Browse tool configuration
browse_tool_name: "jina"
browse_timeout: ${oc.env:GLM47_BROWSE_TIMEOUT,30}
browse_max_pages_to_fetch: 10
browse_context_char_length: 6000


