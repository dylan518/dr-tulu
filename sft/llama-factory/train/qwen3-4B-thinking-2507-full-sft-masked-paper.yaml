### model
model_name_or_path: Qwen/Qwen3-4B-Thinking-2507
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# This is the "paper-style" masking setup used by the 8B run:
# it masks labels for spans matching the tag(s) in the decoded text.
dataset: rl-research/dr-tulu-sft-data
template: qwen3
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
use_span_masking: true
mask_span_types: "tool_output"

### output
# New output dir so we don't mix with the earlier unmasked run.
output_dir: ckpts/qwen3-4B-thinking-2507/full/sft-masked-paper
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true
save_only_model: true
logging_steps: 5
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 4.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
weight_decay: 0.00


