### model
model_name_or_path: Qwen/Qwen3-4B-Thinking-2507
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
# NOTE: This matches the dataset already registered in data/dataset_info.json.
dataset: rl-research/dr-tulu-sft-data
template: qwen3
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
use_span_masking: true
mask_span_types: "tool_output"

### output
# Resume from the completed 3-epoch run (global_step=309) and extend to 5 total epochs.
output_dir: ckpts/qwen3-4B-thinking-2507/full/sft
overwrite_output_dir: false
logging_steps: 5
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 4.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
weight_decay: 0.00

### resume
resume_from_checkpoint: ckpts/qwen3-4B-thinking-2507/full/sft/checkpoint-309





