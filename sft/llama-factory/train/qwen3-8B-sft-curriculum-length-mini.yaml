### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: rl-research/dr-tulu-sft-data
template: qwen3
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
use_span_masking: true
mask_span_types: "tool_output"

# Curriculum: sort by tokenized length (ascending) and disable shuffling
sort_by_token_length: true
disable_shuffling: true

# Mini run controls
max_samples: 256
max_steps: 6
num_train_epochs: 1

### output
output_dir: ckpts/qwen3-8B-sft-curriculum-len-mini
logging_steps: 1
plot_loss: true
overwrite_output_dir: true
report_to: none

### checkpoints (save at least one so we can confirm saving works)
save_strategy: steps
save_steps: 3
save_total_limit: 2
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 4.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
weight_decay: 0.00


